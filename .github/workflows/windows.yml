name: Windows

# Builds CraftSuite for Windows x64: the start window plus FilmCraft and EffectCraft from the
# pinned submodules, each with its own lockfile, exactly as their own release builds do.
# Every run uploads CraftSuite-Setup-<version>.exe (per-user installer, no admin rights) and a
# portable folder as artifacts; a pushed tag v* (or a release created on github.com) also
# publishes them as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: x86_64-pc-windows-msvc
  # Static CRT, as the apps' own Windows builds: no Visual C++ redistributable needed.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Build ${{ matrix.app }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [filmcraft, effectcraft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out ${{ matrix.app }}
        shell: bash
        run: git submodule update --init --depth 1 "vendor/${{ matrix.app }}"
      # CraftSuite's own small fixes (patches/<app>/*.patch), applied on top of the pinned release.
      - name: Apply patches
        shell: bash
        run: |
          shopt -s nullglob
          for p in patches/${{ matrix.app }}/*.patch; do
            echo "applying $p"
            git -C "vendor/${{ matrix.app }}" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done
      # FilmCraft's release build embeds these fonts (Japanese UI); same pin as its release.yml.
      - if: matrix.app == 'filmcraft'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/${{ matrix.app }} -> target
          key: windows-${{ matrix.app }}
      - name: Build
        shell: bash
        working-directory: vendor/${{ matrix.app }}
        env:
          FILMCRAFT_REQUIRE_WINRES: "1"
          EFFECTCRAFT_REQUIRE_WINRES: "1"
        run: |
          if [ "${{ matrix.app }}" = filmcraft ]; then
            export CRAFT_FONTS_DIR="$GITHUB_WORKSPACE/craft-fonts" CRAFT_FONTS_REQUIRED=1
          fi
          cargo build --release --locked -p "${{ matrix.app }}" -p "${{ matrix.app }}-cli" --target "$TARGET"
          bin="target/$TARGET/release"
          "$bin/${{ matrix.app }}-cli.exe" --version
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$bin/${{ matrix.app }}.exe" "$bin/${{ matrix.app }}-cli.exe" "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.app }}
          path: out/*
          if-no-files-found: error

  launcher:
    name: Build CraftSuite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-launcher
      - name: Test
        shell: bash
        run: cargo test --release --locked --target "$TARGET"
      - name: Build
        shell: bash
        env:
          CRAFTSUITE_REQUIRE_WINRES: "1"
        run: |
          cargo build --release --locked --target "$TARGET"
          "target/$TARGET/release/craftsuite.exe" --version
          mkdir -p out && cp "target/$TARGET/release/craftsuite.exe" out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-launcher
          path: out/*
          if-no-files-found: error

  package:
    name: Package (installer + portable)
    needs: [app, launcher]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bin
      - name: Assemble
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          CRAFT_FONTS_DIR="$PWD/craft-fonts" packaging/assemble.sh "dist/CraftSuite" \
            bin/bin-launcher/craftsuite.exe bin/bin-filmcraft bin/bin-effectcraft .exe
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = Get-Item $candidate
          }
          & $iscc.Source /Qp "/DAppVersion=${{ steps.version.outputs.version }}" installer/CraftSuite.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CraftSuite -DestinationPath "dist/CraftSuite-${{ steps.version.outputs.version }}-portable.zip"
          Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CraftSuite-Setup-${{ steps.version.outputs.version }}
          path: dist/CraftSuite-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CraftSuite-${{ steps.version.outputs.version }}-portable
          path: dist/CraftSuite
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/CraftSuite-Setup-*.exe dist/CraftSuite-*-portable.zip)
          # A release created on github.com (which also creates the tag) just gets the files attached.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "CraftSuite $GITHUB_REF_NAME" --generate-notes
          fi
