name: Windows

# Builds CraftSuite for Windows x64: the start window plus FilmCraft and EffectCraft from the
# pinned submodules, each with its own lockfile, exactly as their own release builds do.
# Every run uploads CraftSuite-<version>-windows-x64.zip as an artifact; a pushed tag v*
# also publishes it as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: x86_64-pc-windows-msvc
  # Static CRT, as the apps' own Windows builds: no Visual C++ redistributable needed.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Build ${{ matrix.app }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: [filmcraft, effectcraft]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out ${{ matrix.app }}
        shell: bash
        run: git submodule update --init --depth 1 "vendor/${{ matrix.app }}"
      # FilmCraft's release build embeds these fonts (Japanese UI); same pin as its release.yml.
      - if: matrix.app == 'filmcraft'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/${{ matrix.app }} -> target
          key: windows-${{ matrix.app }}
      - name: Build
        shell: bash
        working-directory: vendor/${{ matrix.app }}
        env:
          FILMCRAFT_REQUIRE_WINRES: "1"
          EFFECTCRAFT_REQUIRE_WINRES: "1"
        run: |
          if [ "${{ matrix.app }}" = filmcraft ]; then
            export CRAFT_FONTS_DIR="$GITHUB_WORKSPACE/craft-fonts" CRAFT_FONTS_REQUIRED=1
          fi
          cargo build --release --locked -p "${{ matrix.app }}" -p "${{ matrix.app }}-cli" --target "$TARGET"
          bin="target/$TARGET/release"
          "$bin/${{ matrix.app }}-cli.exe" --version
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$bin/${{ matrix.app }}.exe" "$bin/${{ matrix.app }}-cli.exe" "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.app }}
          path: out/*
          if-no-files-found: error

  launcher:
    name: Build CraftSuite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-launcher
      - name: Test
        shell: bash
        run: cargo test --release --locked --target "$TARGET"
      - name: Build
        shell: bash
        env:
          CRAFTSUITE_REQUIRE_WINRES: "1"
        run: |
          cargo build --release --locked --target "$TARGET"
          "target/$TARGET/release/craftsuite.exe" --version
          mkdir -p out && cp "target/$TARGET/release/craftsuite.exe" out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-launcher
          path: out/*
          if-no-files-found: error

  package:
    name: Package
    needs: [app, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bin
      - name: Assemble and zip
        id: zip
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="CraftSuite-$version-windows-x64"
          CRAFT_FONTS_DIR="$PWD/craft-fonts" packaging/assemble.sh "dist/CraftSuite" \
            bin/bin-launcher/craftsuite.exe bin/bin-filmcraft bin/bin-effectcraft .exe
          (cd dist && zip -qr9 "$name.zip" CraftSuite)
          ls -la dist
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/CraftSuite
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/${{ steps.zip.outputs.name }}.zip"
          # A release created on github.com (which also creates the tag) just gets the file attached.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" \
              --title "CraftSuite $GITHUB_REF_NAME" --generate-notes
          fi
