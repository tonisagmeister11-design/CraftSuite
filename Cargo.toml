[package]
name = "craftsuite"
description = "CraftSuite: ein Startfenster für FilmCraft und EffectCraft"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
build = "build.rs"
publish = false

# The two apps under vendor/ are their own Cargo workspaces, built with their own lockfiles.
[workspace]
exclude = ["vendor"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "accesskit", "wayland", "x11"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# Finding the started app's window (EnumWindows), to know it is really up.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# Icon + VERSIONINFO for CraftSuite.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
